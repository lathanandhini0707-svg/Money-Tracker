<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b5e3c">
<title>Home & Money Manager</title>
<style>
:root{--bg:#f5fbff;--card:#ffffff;--text:#203047;--muted:#6c7a89;--accent:#4f8cff;--accent2:#7b61ff;--soft:#eaf2ff;--good:#18a66b;--bad:#e05252;--line:#dce8f5}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#4f8cff,#7b61ff);color:white;padding:22px 18px;position:sticky;top:0;z-index:5}
h1{margin:0 0 5px;font-size:25px}header p{margin:0;opacity:.9}
nav{display:none}
nav button{white-space:nowrap;border:0;border-radius:20px;padding:10px 14px;background:var(--soft);color:var(--text);font-weight:700}
nav button.active{background:var(--accent);color:#fff}
main{max-width:1100px;margin:auto;padding:16px}.page{display:none}.page.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 12px #5b3a2210}
.card h3{margin:0 0 8px}.amount{font-size:24px;font-weight:800}.muted{color:var(--muted);font-size:13px}
form,.formgrid{display:grid;gap:10px}.formgrid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
input,select,textarea{width:100%;padding:11px;border:1px solid #d9c5b3;border-radius:10px;background:#fff;font-size:15px}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;padding:11px 15px;border-radius:10px;font-weight:700;box-shadow:0 5px 14px #4f8cff25}
button.danger{background:#fff0f0;color:var(--bad);border:1px solid #f0caca;padding:8px;border-radius:8px}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.list{display:grid;gap:9px}.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.item.done{text-decoration:line-through;opacity:.55}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:var(--soft);font-size:12px}.good{color:var(--good)}.bad{color:var(--bad)}
.progress{height:9px;background:#eee0d4;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}
.section-title{margin-top:24px}.hidden{display:none!important}
@media(max-width:600px){main{padding:10px}h1{font-size:22px}nav{top:78px}th,td{font-size:12px;padding:7px}}
.menuBtn{position:absolute;right:15px;top:18px;width:46px;height:46px;border:0;border-radius:14px;background:#ffffff25;color:#fff;font-size:28px;font-weight:900;cursor:pointer}
.menuPanel{position:fixed;right:12px;top:74px;width:min(300px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 15px 40px #20304730;z-index:20;display:none}
.menuPanel.show{display:block}
.menuPanel button{width:100%;text-align:left;border:0;background:#fff;padding:12px;border-radius:10px;font-weight:700;color:var(--text)}
.menuPanel button:hover{background:var(--soft)}
.actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
button.small{padding:7px 10px;border:0;border-radius:8px;background:var(--soft);color:var(--text);font-weight:700}
button.savebtn{background:#e9fff4;color:var(--good)}
button.editbtn{background:#eef4ff;color:#3976df}
</style>
</head>
<body>
<header><button class="menuBtn" onclick="toggleMenu()" aria-label="Menu">⋮</button><h1>🏠 Home & Money Manager</h1><p>Income • Expenses • Savings • Plans • Household</p></header>
<nav id="nav"></nav><div id="menuPanel" class="menuPanel"></div>
<main id="app"></main>

<script>
const KEY="homeMoneyManager_v1";
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{
 income:[], expenses:[], savings:[], payments:[], tasks:[], recharges:[], groceries:[], plans:[]
};
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
data.accounts=data.accounts||[];data.accounts.forEach(a=>{a.owner=a.owner||''});data.accountTx=data.accountTx||[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const navItems=[
['dashboard','🏠 Dashboard'],['accounts','💳 Accounts'],['income','💰 Income'],['expenses','🧾 Expenses'],
['savings','🏦 Savings'],['savingplan','📊 Save Plan'],['tasks','🧹 Home Tasks'],
['recharge','📱 Recharge'],['grocery','🛒 Grocery'],['reports','📈 Reports']
];
let current='dashboard';
function renderNav(){
document.getElementById('nav').innerHTML='';
document.getElementById('menuPanel').innerHTML=navItems.map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join('');
}
function toggleMenu(){document.getElementById('menuPanel').classList.toggle('show')}
function go(p){current=p;renderNav();document.getElementById('menuPanel').classList.remove('show');render()}
function totalIncome(type){return data.income.filter(x=>x.type==type).reduce((a,x)=>a+ +x.amount,0)}
function totalExpense(source){return data.expenses.filter(x=>x.source==source).reduce((a,x)=>a+ +x.amount,0)}
function render(){let a=document.getElementById('app');renderNav();
if(current==='dashboard')a.innerHTML=dashboard();
if(current==='accounts')a.innerHTML=accountsPage();
if(current==='income')a.innerHTML=incomePage();
if(current==='expenses')a.innerHTML=expensePage();
if(current==='savings')a.innerHTML=savingsPage();
if(current==='savingplan')a.innerHTML=planPage();
if(current==='tasks')a.innerHTML=tasksPage();
if(current==='recharge')a.innerHTML=rechargePage();
if(current==='grocery')a.innerHTML=groceryPage();
if(current==='reports')a.innerHTML=reportsPage();
}

function saveEdit(collection,index,obj){data[collection][index]=obj;save();render()}
function removeItem(collection,index){if(confirm('Delete this item?')){data[collection].splice(index,1);save();render()}}
function editIncome(i){let x=data.income[i],amount=prompt('Amount',x.amount),note=prompt('Source / note',x.note||'');if(amount===null)return;x.amount=+amount;x.note=note||'';save();render()}
function editExpense(i){let x=data.expenses[i],amount=prompt('Amount',x.amount),cat=prompt('Category',x.category),note=prompt('Note',x.note||'');if(amount===null)return;x.amount=+amount;x.category=cat||x.category;x.note=note||'';save();render()}
function editSaving(i){let x=data.savings[i],amount=prompt('Installment / amount',x.amount),goal=prompt('Total target',x.total||0);if(amount===null)return;x.amount=+amount;x.total=+goal||0;save();render()}
function editPlan(i){let x=data.plans[i],name=prompt('Goal name',x.name),target=prompt('Target amount',x.target),monthly=prompt('Monthly saving',x.monthly);if(name===null)return;x.name=name;x.target=+target||0;x.monthly=+monthly||0;save();render()}
function editTask(i){let x=data.tasks[i],name=prompt('Task',x.name),date=prompt('Due date YYYY-MM-DD',x.date);if(name===null)return;x.name=name;x.date=date||x.date;save();render()}
function editRecharge(i){let x=data.recharges[i],name=prompt('Person / label',x.name),amount=prompt('Amount',x.amount),date=prompt('Next recharge date YYYY-MM-DD',x.date);if(name===null)return;x.name=name;x.amount=+amount||0;x.date=date||x.date;save();render()}
function editGrocery(i){let x=data.groceries[i],name=prompt('Item',x.name),qty=prompt('Qty / notes',x.qty||'');if(name===null)return;x.name=name;x.qty=qty||'';save();render()}
function editAccount(i){
 ensureAccounts();let x=data.accounts[i];
 let owner=prompt('Person name',x.owner||''),name=prompt('Account / Bank name',x.name),bal=prompt('Current balance',x.balance);
 if(name===null)return;
 x.owner=owner||x.owner||'';x.name=name;x.balance=+bal||0;save();render()
}
function editAccountTx(i){ensureAccounts();let x=data.accountTx[i],d=prompt('What happened?',x.description),amt=prompt('Money amount',x.debit||x.credit);if(d===null)return;x.description=d;x.debit=x.debit?+amt:0;x.credit=x.credit?+amt:0;save();render()}
function dashboard(){
let mi=totalIncome('Monthly'),di=totalIncome('Daily'),me=totalExpense('Monthly Income'),de=totalExpense('Daily Income');
let saveAvail=mi+di-me-de-data.savings.filter(x=>x.status==='Paid').reduce((a,x)=>a+ +x.amount,0);
let due=data.savings.filter(x=>x.nextDue&&x.nextDue<=today()&&!x.paidToday);
return `<h2>Dashboard</h2><div class="grid">
<div class="card"><h3>Monthly Income</h3><div class="amount">${money(mi)}</div><div class="muted">Spent from monthly income: ${money(me)}</div></div>
<div class="card"><h3>Daily Income</h3><div class="amount">${money(di)}</div><div class="muted">Spent from daily income: ${money(de)}</div></div>
<div class="card"><h3>Money Available to Save</h3><div class="amount ${saveAvail>=0?'good':'bad'}">${money(saveAvail)}</div><div class="muted">Automatic estimate</div></div>
<div class="card"><h3>Upcoming / Due</h3><div class="amount">${due.length}</div><div class="muted">Savings payments due today</div></div>
</div>
<h3 class="section-title">Savings Snapshot</h3><div class="grid">${data.savings.length?data.savings.map(s=>`<div class="card"><div class="row"><b>${esc(s.name)}</b><span class="badge">${esc(s.type)}</span></div><div>Paid: ${money(s.paid||0)} / Target: ${money(s.total||0)}</div><div class="progress"><i style="width:${Math.min(100,(s.paid||0)/(s.total||1)*100)}%"></i></div><p class="muted">Next due: ${s.nextDue||'-'}</p></div>`).join(''):'<div class="card">No savings added yet.</div>'}</div>
<h3 class="section-title">Quick Add</h3><div class="grid"><button class="primary" onclick="go('income')">+ Add Income</button><button class="primary" onclick="go('expenses')">+ Add Expense</button><button class="primary" onclick="go('savings')">+ Add Saving</button><button class="primary" onclick="go('tasks')">+ Add Home Task</button></div>`;
}

function accountsPage(){
let bal=data.accounts||[];
let tx=data.accountTx||[];
let total=bal.reduce((a,x)=>a+ +x.balance,0);
return `<h2>💳 Accounts & Passbook Ledger</h2>
<div class="card"><p><b>இந்த page மட்டும் account/passbook tracking-க்காக.</b> Dashboard-ல் account balances காட்டப்படாது.</p>
<form onsubmit="addAccount(event)"><div class="formgrid">
<input id="aowner" placeholder="Person name (e.g. Latha)" required>
<input id="acn" placeholder="Bank / Account name (e.g. SBI, HDFC)" required>
<select id="act"><option>Bank Account</option><option>GPay / UPI</option><option>Cash</option><option>Family Account</option><option>Other</option></select>
<input id="acb" type="number" step="0.01" min="0" placeholder="Current / Opening Balance" required>
<input id="aco" placeholder="Owner / Bank note">
</div><button class="primary">Add Account</button></form></div>

<div class="card"><h3>👤 Select Person</h3>
<select id="accountOwnerSelect" onchange="showOwnerAccounts(this.value)">
<option value="">All people</option>
${[...new Set(bal.map(a=>a.owner).filter(Boolean))].map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}
</select>
<div id="ownerAccountSummary" class="muted" style="margin-top:10px">Choose a person to see their bank accounts and balances.</div>
</div>
<div id="accountCards" class="grid">${bal.map((a,i)=>`<div class="card account-card" data-owner="${esc(a.owner||'')}">
<div class="row"><h3>${esc(a.name)}</h3><span class="badge">${esc(a.type)}</span></div>
<div class="muted">👤 ${esc(a.owner||'Not specified')}</div>
<div class="amount">${money(a.balance)}</div><div class="muted">${esc(a.note||'')}</div>
<button class="primary" onclick="accountExpense(${i})">− Money Out</button>
<button class="primary" onclick="accountIncome(${i})">+ Money In</button>
<div class="actions"><button class="small editbtn" onclick="editAccount(${i})">✏️ Edit</button><button class="small" onclick="deleteAccount(${i})">🗑️ Delete</button><button class="small savebtn" onclick="save()">💾 Save</button></div>
</div>`).join('')||'<div class="card">No accounts added. Add your bank, GPay or family accounts here.</div>'}</div>

<h3 class="section-title">📸 Passbook / Statement Screenshot → Ledger</h3>
<div class="card">
<p class="muted">Upload a clear screenshot/photo of your passbook or bank statement. The app will try to read date, description, debit, credit and balance. You should review the extracted entries before adding them.</p>
<input id="statementFile" type="file" accept="image/*" onchange="readStatementImage(event)">
<div id="ocrStatus" class="muted" style="margin-top:10px"></div>
<div id="ocrResult"></div>
</div>

<h3 class="section-title">📒 Easy Ledger</h3>
<div class="card">
<table><tr><th>Date</th><th>Account</th><th>What happened?</th><th>Money Out</th><th>Money In</th><th>Balance</th></tr>
${tx.slice().reverse().map((t,i)=>`<tr><td>${esc(t.date)}</td><td>${esc(t.account)}</td><td>${esc(t.description)}</td><td>${t.debit?money(t.debit):'-'}</td><td>${t.credit?money(t.credit):'-'}</td><td>${money(t.balance)}</td></tr>`).join('')||'<tr><td colspan="6">No ledger entries yet.</td></tr>'}</table>
</div>
<div class="card"><b>Total tracked account balance:</b> ${money(total)}</div>`;
}
function ensureAccounts(){data.accounts=data.accounts||[];data.accountTx=data.accountTx||[]}
function addAccount(e){
 e.preventDefault();ensureAccounts();
 data.accounts.push({owner:aowner.value.trim(),name:acn.value.trim(),type:act.value,balance:+acb.value,note:aco.value});
 save();go('accounts')
}
function showOwnerAccounts(owner){
 const cards=[...document.querySelectorAll('.account-card')];
 cards.forEach(c=>c.style.display=(!owner||c.dataset.owner===owner)?'block':'none');
 const list=data.accounts.filter(a=>!owner||a.owner===owner);
 const total=list.reduce((s,a)=>s+(+a.balance||0),0);
 const el=document.getElementById('ownerAccountSummary');
 if(el) el.innerHTML=owner
   ? `<b>${esc(owner)}</b> — ${list.length} account(s) — Total balance: <span class="good"><b>${money(total)}</b></span><br><span class="muted">${list.map(a=>esc(a.name)+': '+money(a.balance)).join(' • ')}</span>`
   : 'Choose a person to see their bank accounts and balances.';
}
function accountExpense(i){
ensureAccounts();let a=data.accounts[i],v=prompt('எவ்வளவு பணம் போனது?');if(v===null)return;v=+v;if(!v||v<0)return;
let d=prompt('எதற்காக? (Grocery / Recharge / Transfer...)','Expense');a.balance-=v;
data.accountTx.push({date:today(),account:a.name,description:d||'Expense',debit:v,credit:0,balance:a.balance});save();render()
}
function accountIncome(i){
ensureAccounts();let a=data.accounts[i],v=prompt('எவ்வளவு பணம் வந்தது?');if(v===null)return;v=+v;if(!v||v<0)return;
let d=prompt('எங்கிருந்து வந்தது?','Income');a.balance+=v;
data.accountTx.push({date:today(),account:a.name,description:d||'Income',debit:0,credit:v,balance:a.balance});save();render()
}
function deleteAccount(i){if(confirm('Delete this account?')){ensureAccounts();data.accounts.splice(i,1);save();render()}}

async function readStatementImage(e){
const file=e.target.files[0]; if(!file)return;
const status=document.getElementById('ocrStatus'),out=document.getElementById('ocrResult');
status.textContent='Reading image… OCR library loading.';
out.innerHTML='';
try{
 if(!window.Tesseract){
  await new Promise((resolve,reject)=>{
   const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
   s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
  });
 }
 status.textContent='OCR running… This can take a little time.';
 const result=await Tesseract.recognize(file,'eng');
 const text=result.data.text||'';
 status.textContent='Text read. Please review the suggested ledger rows below.';
 const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const rows=[];
 for(const line of lines){
   const nums=line.match(/(?:₹|Rs\.?|INR)?\s*[\d,]+(?:\.\d{1,2})?/g);
   if(nums && nums.length){
     const amounts=nums.map(n=>parseFloat(n.replace(/[^\d.]/g,''))).filter(n=>!isNaN(n));
     if(amounts.length) rows.push({raw:line,amount:amounts[amounts.length-1]});
   }
 }
 window._ocrRows=rows;
 out.innerHTML=`<div class="card"><b>Extracted text:</b><pre style="white-space:pre-wrap;font-size:12px">${esc(text.slice(0,12000))}</pre>
 <p class="muted">OCR cannot reliably understand every bank/passbook layout. Use the review fields below and correct anything wrong before saving.</p>
 <button class="primary" onclick="saveOCRRows()">Add reviewed rows to Ledger</button></div>`;
}catch(err){
 status.textContent='OCR could not run. You can still add transactions manually.';
 out.innerHTML='<div class="card">Try a clearer screenshot, or use Money Out / Money In on the account card.</div>';
}}
function saveOCRRows(){
ensureAccounts();const rows=window._ocrRows||[];
if(!rows.length){alert('No amount-like entries were detected.');return}
const account=prompt('Which account does this statement belong to?');
if(!account)return;
let a=data.accounts.find(x=>x.name.toLowerCase()===account.toLowerCase());
if(!a){alert('Account not found. Add the account first.');return}
rows.forEach(r=>{data.accountTx.push({date:today(),account:a.name,description:'Statement entry (reviewed)',debit:0,credit:0,balance:a.balance,raw:r.raw})});
save();render();alert(rows.length+' statement rows added. Please review the ledger.');
}

function incomePage(){return `<h2>Income</h2><div class="card"><form onsubmit="addIncome(event)"><div class="formgrid">
<select id="it"><option>Daily</option><option>Monthly</option></select><input id="ia" type="number" min="0" step="0.01" placeholder="Amount" required>
<select id="im"><option>Cash</option><option>GPay</option><option>Net Banking</option></select><input id="idate" type="date" value="${today()}" required><input id="inote" placeholder="Source / note"></div><button class="primary">Add Income</button></form></div>
<h3>Income Entries</h3><div class="list">${data.income.slice().reverse().map((x,i)=>`<div class="item"><div class="row"><b>${money(x.amount)}</b><span class="badge">${x.type} • ${x.method}</span></div><div class="muted">${x.date} • ${esc(x.note||'')}</div><div class="actions"><button class="small editbtn" onclick="editIncome(${data.income.indexOf(x)})">✏️ Edit</button><button class="small" onclick="removeItem('income',${data.income.indexOf(x)})">🗑️ Delete</button><button class="small savebtn" onclick="save()">💾 Save</button></div></div>`).join('')||'<div class="card">No income entries.</div>'}</div>`}
function addIncome(e){e.preventDefault();data.income.push({type:it.value,amount:ia.value,method:im.value,date:idate.value,note:inote.value});save();go('income')}
function expensePage(){return `<h2>Expenses</h2><div class="card"><form onsubmit="addExpense(event)"><div class="formgrid">
<select id="es"><option>Monthly Income</option><option>Daily Income</option><option>Other Savings</option></select><input id="ea" type="number" min="0" step="0.01" placeholder="Amount" required><input id="ec" placeholder="Category (Dress, Grocery, House...) " required><select id="em"><option>Cash</option><option>GPay</option><option>Net Banking</option></select><input id="ed" type="date" value="${today()}"><input id="en" placeholder="Note"></div><button class="primary">Add Expense</button></form></div>
<h3>Monthly Income Expenses: ${money(totalExpense('Monthly Income'))}</h3><h3>Daily Income Expenses: ${money(totalExpense('Daily Income'))}</h3><div class="list">${data.expenses.slice().reverse().map(x=>`<div class="item"><div class="row"><b>${money(x.amount)} — ${esc(x.category)}</b><span class="badge">${x.source}</span></div><div class="muted">${x.date} • ${x.method} • ${esc(x.note||'')}</div><div class="actions"><button class="small editbtn" onclick="editExpense(${data.expenses.indexOf(x)})">✏️ Edit</button><button class="small" onclick="removeItem('expenses',${data.expenses.indexOf(x)})">🗑️ Delete</button><button class="small savebtn" onclick="save()">💾 Save</button></div></div>`).join('')||'<div class="card">No expenses.</div>'}</div>`}
function addExpense(e){e.preventDefault();data.expenses.push({source:es.value,amount:ea.value,category:ec.value,method:em.value,date:ed.value,note:en.value});save();go('expenses')}
function savingsPage(){return `<h2>Savings</h2><div class="card"><form onsubmit="addSaving(event)"><div class="formgrid">
<input id="sn" placeholder="Saving name (e.g. RD)" required><select id="st"><option>RD</option><option>PPF</option><option>CDA</option><option>DigiGold</option><option>Gold Chit</option><option>Post Office</option><option>Other</option></select><input id="sa" type="number" min="0" placeholder="Installment / amount" required><input id="sgoal" type="number" min="0" placeholder="Total target / maturity amount"><input id="ss" type="date" value="${today()}"><input id="se" type="date"><input id="sd" type="date" value="${today()}"><input id="snext" type="date" value="${today()}"><select id="spay"><option>Cash</option><option>GPay</option><option>Net Banking</option></select></div><button class="primary">Add Saving Plan</button></form></div>
<div class="grid">${data.savings.map((s,i)=>`<div class="card"><div class="row"><h3>${esc(s.name)}</h3><span class="badge">${s.type}</span></div><p>Installment: <b>${money(s.amount)}</b></p><p>Paid: <b>${money(s.paid||0)}</b> / ${money(s.total||0)}</p><p>Start: ${s.start||'-'} • End: ${s.end||'-'}</p><p>Next due: <b class="${s.nextDue<=today()?'bad':''}">${s.nextDue||'-'}</b></p><div class="progress"><i style="width:${Math.min(100,(s.paid||0)/(s.total||1)*100)}%"></i></div><br><button class="primary" onclick="paySaving(${i})">✓ Pay & Set Next Due</button><div class="actions"><button class="small editbtn" onclick="editSaving(${i})">✏️ Edit</button><button class="small" onclick="delSaving(${i})">🗑️ Delete</button><button class="small savebtn" onclick="save()">💾 Save</button></div></div>`).join('')||'<div class="card">Add your RD, PPF, CDA, DigiGold or other savings here.</div>'}</div>`}
function addSaving(e){e.preventDefault();data.savings.push({name:sn.value,type:st.value,amount:+sa.value,total:+sgoal.value,start:ss.value,end:se.value,lastPaid:null,nextDue:snext.value,method:spay.value,paid:0});save();go('savings')}
function paySaving(i){let s=data.savings[i];s.paid=(s.paid||0)+ +s.amount;s.lastPaid=today();let d=new Date(s.nextDue||today());d.setMonth(d.getMonth()+1);s.nextDue=d.toISOString().slice(0,10);s.paidToday=true;save();render()}
function delSaving(i){if(confirm('Delete this saving?')){data.savings.splice(i,1);save();render()}}
function planPage(){return `<h2>Save Plan & Budget Planner</h2><div class="card"><form onsubmit="addPlan(event)"><div class="formgrid"><input id="pn" placeholder="Goal (Trip / Outing / Movie / Dress)" required><select id="pc"><option>Trip</option><option>Monthly Outing</option><option>Movie</option><option>Beach</option><option>Engagement / Function</option><option>Dress</option><option>Household Purchase</option><option>Other</option></select><input id="pt" type="number" min="0" placeholder="Target amount" required><input id="pmo" type="number" min="0" placeholder="Monthly amount you can save" required><input id="pdate" type="date"><textarea id="pnote" placeholder="Plan / details"></textarea></div><button class="primary">Add Plan</button></form></div>
<div class="grid">${data.plans.map((p,i)=>`<div class="card"><h3>${esc(p.name)}</h3><span class="badge">${p.category}</span><p>Target: ${money(p.target)}</p><p>Monthly save: ${money(p.monthly)}</p><p class="muted">Suggested: ${p.target&&p.monthly?Math.ceil(p.target/p.monthly)+' months':''}</p><div class="actions"><button class="small editbtn" onclick="editPlan(${i})">✏️ Edit</button><button class="small" onclick="removeItem('plans',${i})">🗑️ Delete</button><button class="small savebtn" onclick="save()">💾 Save</button></div></div>`).join('')||'<div class="card">Example planning: add a Trip, monthly outing, movie, beach, dress or household goal with the amount you can realistically save.</div>'}</div>`}
function addPlan(e){e.preventDefault();data.plans.push({name:pn.value,category:pc.value,target:+pt.value,monthly:+pmo.value,date:pdate.value,note:pnote.value});save();go('savingplan')}
function tasksPage(){return `<h2>Home Tasks & Reminders</h2><div class="card"><form onsubmit="addTask(event)"><div class="formgrid"><input id="tn" placeholder="Task (Clean house, Pooja, Garden...)" required><select id="tf"><option>Monthly</option><option>Weekly</option><option>Daily</option><option>One Time</option></select><input id="td" type="date" value="${today()}"><input id="trem" type="number" min="0" value="1" placeholder="Remind days before"><input id="tnote" placeholder="Note"></div><button class="primary">Add Task</button></form></div><div class="list">${data.tasks.map((t,i)=>`<div class="item ${t.done?'done':''}"><div class="row"><label><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})"> <b>${esc(t.name)}</b></label><span class="badge">${t.freq}</span></div><div class="muted">Due: ${t.date} • Reminder: ${t.remind} day(s) before • ${esc(t.note||'')}</div><div class="actions"><button class="small editbtn" onclick="editTask(${i})">✏️ Edit</button><button class="small" onclick="removeItem('tasks',${i})">🗑️ Delete</button><button class="small savebtn" onclick="save()">💾 Save</button></div></div>`).join('')||'<div class="card">Add cleaning, pooja, garden and other household tasks.</div>'}</div>`}
function addTask(e){e.preventDefault();data.tasks.push({name:tn.value,freq:tf.value,date:td.value,remind:+trem.value,note:tnote.value,done:false});save();go('tasks')}
function toggleTask(i){data.tasks[i].done=!data.tasks[i].done;save();render()}
function rechargePage(){return `<h2>Recharge Manager</h2><div class="card"><form onsubmit="addRecharge(event)"><div class="formgrid"><input id="rn" placeholder="Person / Number label" required><select id="rt"><option>Mobile</option><option>DTH</option><option>Internet</option><option>Other</option></select><input id="ram" type="number" placeholder="Amount" required><input id="rd" type="date" value="${today()}"><select id="rm"><option>GPay</option><option>Cash</option><option>Net Banking</option></select></div><button class="primary">Add Recharge</button></form></div><div class="list">${data.recharges.map((r,i)=>`<div class="item"><div class="row"><b>${esc(r.name)} — ${money(r.amount)}</b><span class="badge">${r.type}</span></div><div class="muted">Next recharge: ${r.date} • ${r.method}</div><button class="primary" onclick="doneRecharge(${i})">Recharge Done → Next Month</button><div class="actions"><button class="small editbtn" onclick="editRecharge(${i})">✏️ Edit</button><button class="small" onclick="removeItem('recharges',${i})">🗑️ Delete</button><button class="small savebtn" onclick="save()">💾 Save</button></div></div>`).join('')||'<div class="card">Add family members / services that need monthly recharge.</div>'}</div>`}
function addRecharge(e){e.preventDefault();data.recharges.push({name:rn.value,type:rt.value,amount:+ram.value,date:rd.value,method:rm.value});save();go('recharge')}
function doneRecharge(i){let r=data.recharges[i],d=new Date(r.date);d.setMonth(d.getMonth()+1);r.date=d.toISOString().slice(0,10);save();render()}
function groceryPage(){return `<h2>Grocery & Shopping Checklists</h2><div class="card"><form onsubmit="addGrocery(event)"><div class="formgrid"><input id="gn" placeholder="Item name" required><select id="gc"><option>Kitchen / Cooking</option><option>Cleaning</option><option>Personal Care</option><option>Pooja Items</option><option>Other</option></select><input id="gqty" placeholder="Qty / notes"><select id="gf"><option>Monthly</option><option>As Needed</option></select></div><button class="primary">Add Grocery Item</button></form></div>
${['Kitchen / Cooking','Cleaning','Personal Care','Pooja Items','Other'].map(c=>`<h3>${c}</h3><div class="list">${data.groceries.filter(g=>g.category==c).map((g,i)=>`<div class="item ${g.done?'done':''}"><label><input type="checkbox" ${g.done?'checked':''} onchange="toggleGrocery(${data.groceries.indexOf(g)})"> <b>${esc(g.name)}</b></label> <span class="badge">${g.freq}</span><div class="muted">${esc(g.qty||'')}</div><div class="actions"><button class="small editbtn" onclick="editGrocery(${data.groceries.indexOf(g)})">✏️ Edit</button><button class="small" onclick="removeItem('groceries',${data.groceries.indexOf(g)})">🗑️ Delete</button><button class="small savebtn" onclick="save()">💾 Save</button></div></div>`).join('')||'<div class="muted">No items yet.</div>'}</div>`).join('')}`}
function addGrocery(e){e.preventDefault();data.groceries.push({name:gn.value,category:gc.value,qty:gqty.value,freq:gf.value,done:false});save();go('grocery')}
function toggleGrocery(i){data.groceries[i].done=!data.groceries[i].done;save();render()}
function reportsPage(){let cats={};data.expenses.forEach(x=>cats[x.category]=(cats[x.category]||0)+ +x.amount);return `<h2>Reports</h2><div class="grid"><div class="card"><h3>Total Income</h3><div class="amount">${money(totalIncome('Monthly')+totalIncome('Daily'))}</div></div><div class="card"><h3>Total Expenses</h3><div class="amount">${money(data.expenses.reduce((a,x)=>a+ +x.amount,0))}</div></div><div class="card"><h3>Total Savings Paid</h3><div class="amount">${money(data.savings.reduce((a,x)=>a+ +(x.paid||0),0))}</div></div></div><div class="card"><h3>Expense by Category</h3><table><tr><th>Category</th><th>Amount</th></tr>${Object.entries(cats).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`).join('')||'<tr><td colspan="2">No data</td></tr>'}</table></div><div class="card"><h3>Data Backup</h3><button class="primary" onclick="downloadData()">Download Backup</button> <button class="primary" onclick="document.getElementById('restore').click()">Restore Backup</button><input id="restore" class="hidden" type="file" accept=".json" onchange="restoreData(event)"></div>`}
function downloadData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='home-money-manager-backup.json';a.click()}
function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();render()}catch{alert('Invalid backup')}};r.readAsText(f)}
render();
</script>
</body>
</html>
